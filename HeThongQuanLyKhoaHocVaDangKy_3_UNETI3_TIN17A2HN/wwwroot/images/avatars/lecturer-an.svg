<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="60" cy="60" r="58"/>
    </clipPath>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="2"/>
  <g clip-path="url(#circleClip)">
    <!-- Suit shoulders -->
    <path d="M15 125 C 20 85, 42 78, 60 78 C 78 78, 100 85, 105 125 Z" fill="#1e293b"/>
    <!-- White shirt collar -->
    <polygon points="60,78 48,96 60,98 72,96" fill="#ffffff"/>
    <polygon points="52,78 60,92 46,84" fill="#f8fafc"/>
    <polygon points="68,78 60,92 74,84" fill="#f8fafc"/>
    <!-- Blue Tie -->
    <polygon points="58,92 62,92 64,110 60,118 56,110" fill="#2563eb"/>
    <!-- Neck -->
    <path d="M52 64 L52 82 L68 82 L68 64 Z" fill="#fbcfe8"/>
    <path d="M52 66 C 52 76, 68 76, 68 66 Z" fill="#f472b6" opacity="0.3"/>
    <!-- Face -->
    <ellipse cx="60" cy="50" rx="20" ry="24" fill="#fde047" opacity="0.15"/>
    <ellipse cx="60" cy="50" rx="19" ry="23" fill="#fed7aa"/>
    <!-- Hair -->
    <path d="M41 45 C 40 32, 50 25, 60 25 C 70 25, 80 32, 79 45 C 76 36, 68 32, 60 33 C 50 33, 44 38, 41 45 Z" fill="#0f172a"/>
    <path d="M40 45 C 38 48, 39 55, 41 57 C 42 53, 41 48, 43 45 Z" fill="#0f172a"/>
    <path d="M80 45 C 82 48, 81 55, 79 57 C 78 53, 79 48, 77 45 Z" fill="#0f172a"/>
    <!-- Ears -->
    <ellipse cx="40" cy="51" rx="3" ry="5" fill="#fed7aa"/>
    <ellipse cx="80" cy="51" rx="3" ry="5" fill="#fed7aa"/>
    <!-- Eyebrows -->
    <path d="M47 43 Q 53 41 56 43" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M64 43 Q 67 41 73 43" stroke="#0f172a" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Eyes -->
    <ellipse cx="52" cy="48" rx="2.5" ry="3" fill="#0f172a"/>
    <ellipse cx="68" cy="48" rx="2.5" ry="3" fill="#0f172a"/>
    <circle cx="53" cy="47" r="0.8" fill="#ffffff"/>
    <circle cx="69" cy="47" r="0.8" fill="#ffffff"/>
    <!-- Glasses -->
    <rect x="46" y="44" width="12" height="9" rx="2" fill="none" stroke="#334155" stroke-width="1.5"/>
    <rect x="62" y="44" width="12" height="9" rx="2" fill="none" stroke="#334155" stroke-width="1.5"/>
    <line x1="58" y1="48" x2="62" y2="48" stroke="#334155" stroke-width="1.5"/>
    <!-- Nose -->
    <path d="M59 50 L58 55 L62 55" stroke="#ea580c" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Smile -->
    <path d="M53 60 Q 60 65 67 60" stroke="#b91c1c" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
