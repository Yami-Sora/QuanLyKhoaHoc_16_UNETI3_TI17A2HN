<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="purpleBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="blueBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Laptop -->
  <ellipse cx="320" cy="200" rx="180" ry="80" fill="url(#glowGrad)"/>

  <!-- Isometric Base Shadow -->
  <ellipse cx="320" cy="250" rx="160" ry="25" fill="#0f172a" opacity="0.12"/>

  <!-- ================= LAPTOP ================= -->
  <!-- Laptop Keyboard Base (Isometric) -->
  <g transform="translate(180, 150)">
    <!-- Base Bottom Thickness -->
    <path d="M 120 70 L 260 115 L 140 145 L 0 100 Z" fill="#64748b"/>
    <!-- Base Top Plate -->
    <path d="M 120 62 L 260 107 L 140 137 L 0 92 Z" fill="#cbd5e1"/>
    
    <!-- Keyboard Keys Grid Impression -->
    <path d="M 115 70 L 225 105 L 140 128 L 30 93 Z" fill="#1e293b" opacity="0.85"/>
    <path d="M 100 112 L 135 123 L 125 126 L 90 115 Z" fill="#94a3b8" opacity="0.4"/> <!-- Touchpad -->
  </g>

  <!-- Laptop Screen Lid -->
  <g transform="translate(180, 150)">
    <!-- Screen Bezel Background -->
    <path d="M 0 92 L 120 62 L 120 -50 L 0 -20 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    
    <!-- Screen Glass -->
    <path d="M 8 82 L 112 56 L 112 -42 L 8 -16 Z" fill="url(#laptopScreen)"/>
    
    <!-- Code Editor Header Bar -->
    <path d="M 8 -16 L 112 -42 L 112 -34 L 8 -8 Z" fill="#0f172a"/>
    <circle cx="16" cy="-12" r="2" fill="#ef4444"/>
    <circle cx="23" cy="-14" r="2" fill="#f59e0b"/>
    <circle cx="30" cy="-16" r="2" fill="#10b981"/>

    <!-- Code Syntax Highlight Lines -->
    <line x1="18" y1="-2" x2="65" y2="-14" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <line x1="22" y1="12" x2="85" y2="-4" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="24" x2="98" y2="7" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="36" x2="70" y2="26" stroke="#fde047" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="32" y1="48" x2="105" y2="30" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="22" y1="60" x2="50" y2="53" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ================= FLOATING CODE WINDOW (RIGHT) ================= -->
  <g transform="translate(365, 80)" filter="url(#dropGlow)">
    <rect x="0" y="0" width="105" height="75" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
    <rect x="0" y="0" width="105" height="18" rx="8" fill="#0f172a"/>
    <circle cx="10" cy="9" r="2.5" fill="#ef4444"/>
    <circle cx="18" cy="9" r="2.5" fill="#f59e0b"/>
    <circle cx="26" cy="9" r="2.5" fill="#10b981"/>
    
    <line x1="12" y1="28" x2="60" y2="28" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="38" x2="85" y2="38" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="48" x2="92" y2="48" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="58" x2="45" y2="58" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ================= FLOATING C# BADGE (LEFT) ================= -->
  <g transform="translate(130, 110)" filter="url(#dropGlow)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="url(#purpleBadge)" stroke="#a78bfa" stroke-width="1.5"/>
    <!-- C# Text -->
    <text x="28" y="36" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">C#</text>
  </g>

  <!-- ================= FLOATING GEAR (FAR LEFT) ================= -->
  <g transform="translate(100, 175)">
    <circle cx="18" cy="18" r="14" fill="#38bdf8" opacity="0.9"/>
    <circle cx="18" cy="18" r="6" fill="#f0f9ff"/>
    <path d="M18 1 L18 7 M18 29 L18 35 M1 18 L7 18 M29 18 L35 18 M6 6 L10 10 M26 26 L30 30 M6 30 L10 26 M26 10 L30 6" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ================= FLOATING .NET BADGE (TOP RIGHT) ================= -->
  <g transform="translate(410, 50)" filter="url(#dropGlow)">
    <rect x="0" y="0" width="62" height="34" rx="10" fill="url(#blueBadge)" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="31" y="23" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">.NET</text>
  </g>

  <!-- ================= POTTED PLANT (FAR RIGHT) ================= -->
  <g transform="translate(415, 170)">
    <!-- Shadow -->
    <ellipse cx="20" cy="85" rx="18" ry="6" fill="#0f172a" opacity="0.1"/>
    <!-- Pot -->
    <path d="M 10 65 L 30 65 L 26 84 L 14 84 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Leaves -->
    <path d="M 20 65 Q 10 40 5 30 Q 15 45 20 65" fill="#22c55e"/>
    <path d="M 20 65 Q 20 30 20 20 Q 25 35 20 65" fill="#16a34a"/>
    <path d="M 20 65 Q 32 40 38 32 Q 28 48 20 65" fill="#4ade80"/>
  </g>
</svg>
